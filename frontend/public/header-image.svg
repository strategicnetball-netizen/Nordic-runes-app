<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500">
  <!-- Dark background -->
  <rect width="1024" height="500" fill="#0a0a14"/>
  
  <!-- Gradient overlay for depth -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a14;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#d4af6a;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#d4af6a;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="1024" height="500" fill="url(#bgGradient)"/>
  
  <!-- Glow effect behind rune -->
  <circle cx="512" cy="250" r="120" fill="url(#glowGradient)"/>
  
  <!-- Central rune symbol (Elder Futhark - Fehu) -->
  <g transform="translate(512, 250)">
    <!-- Circle border -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#d4af6a" stroke-width="3" opacity="0.8"/>
    
    <!-- Rune symbol -->
    <g stroke="#d4af6a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main vertical line -->
      <line x1="0" y1="-60" x2="0" y2="60"/>
      <!-- Upper left diagonal -->
      <line x1="0" y1="-30" x2="-30" y2="-50"/>
      <!-- Upper right diagonal -->
      <line x1="0" y1="-30" x2="30" y2="-50"/>
      <!-- Lower left diagonal -->
      <line x1="0" y1="30" x2="-30" y2="50"/>
      <!-- Lower right diagonal -->
      <line x1="0" y1="30" x2="30" y2="50"/>
    </g>
  </g>
  
  <!-- App title -->
  <text x="512" y="420" font-family="serif" font-size="72" font-weight="bold" text-anchor="middle" fill="#d4af6a" letter-spacing="4">
    NORDIC RUNES
  </text>
  
  <!-- Subtitle -->
  <text x="512" y="465" font-family="sans-serif" font-size="24" text-anchor="middle" fill="#d4af6a" opacity="0.8">
    Ancient Wisdom. Modern Guidance.
  </text>
  
  <!-- Decorative elements (corner runes) -->
  <g opacity="0.3">
    <!-- Top left corner detail -->
    <circle cx="80" cy="50" r="20" fill="none" stroke="#d4af6a" stroke-width="2"/>
    <text x="80" y="60" font-family="serif" font-size="24" text-anchor="middle" fill="#d4af6a">✦</text>
    
    <!-- Top right corner detail -->
    <circle cx="944" cy="50" r="20" fill="none" stroke="#d4af6a" stroke-width="2"/>
    <text x="944" y="60" font-family="serif" font-size="24" text-anchor="middle" fill="#d4af6a">✦</text>
  </g>
</svg>
